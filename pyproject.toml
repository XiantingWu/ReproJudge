[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "reprojudge"
version = "0.3.0"
description = "Evidence-first benchmark runner and evaluation contracts for autonomous scientific reproducibility agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "XiantingWu"}]
keywords = ["reproducibility", "benchmark", "scientific-agents", "evaluation", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/XiantingWu/ReproJudge"
Repository = "https://github.com/XiantingWu/ReproJudge"
Documentation = "https://github.com/XiantingWu/ReproJudge/tree/main/docs"
Changelog = "https://github.com/XiantingWu/ReproJudge/blob/main/CHANGELOG.md"
Issues = "https://github.com/XiantingWu/ReproJudge/issues"
Security = "https://github.com/XiantingWu/ReproJudge/security"

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "coverage==7.15.4",
  "editables==0.6",
  "hatchling==1.32.0",
  "hypothesis==6.165.10",
  "jsonschema==4.26.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "twine==7.0.0",
]

[project.scripts]
reprojudge = "reprojudge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reprojudge"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["reprojudge"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/reprojudge"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
